name: CI

on:
  push:
  pull_request:

jobs:
  phpwn-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, mysqli
          tools: composer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: bash tests/run_smoke_test.sh

  vscode-extension-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode_ext
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run compile
